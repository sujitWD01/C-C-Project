<!DOCTYPE html>
<html lang="en">
<head>

body{

}

</head>
<body>
    
    <main>

     <div id="container">

               ComputerChoice = generateChoice();

    </main>
    <h3 id="user-move"></h3>
    <h3 id="computer-move"></h3>
    <h3 id="resultMsg"></h3>
    <h3 id="score"></h3>
 <script>


      let score={
        win : 0,
        tie : 0, 
        lost : 0
      };


        function generateChoice() {
            let RandomNumber  = Math.random()*3;
            if(RandomNumber>0 && RandomNumber<=1) {
                return 'Rock';
            }else if(RandomNumber>1 && RandomNumber<=2) {
                return 'Paper';
            }else {
                return 'Sciessor';
            }

        }
    </script>
 
   
</body>
</html>
