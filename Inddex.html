<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice Exercise</title>
    <style>
        #my-button{
            height: 50px;
            width: 50px;
            font-size: 25px;
            border-radius: 10px;
        }
        .js-odd{
            background-color: chocolate;
        }
        .js-even{
            background-color: lawngreen;
        }
    </style>
</head>
<body>
    <h3 id="greeting"></h3>
    <button id="my-button" onclick="buttonPress();"></button>


    <script>
        let noType = localStorage.getItem('noType') || 0;

function buttonPress() {
    
    noType++;
    localStorage.setItem('noType',noType);
    updateButton();
}
function updateButton() {
    let button = document.querySelector('#my-button');
    
    if(noType % 2===0) {
        button.classList.remove('js-odd');
        button.classList.add('js-even');
    }else{
        button.classList.remove('js-even');
        button.classList.add('js-odd');
    }
  
    button.innerText=noType;

}

updateButton();


        function doGreeting(personName='Sujit ') {
        let date = new Date();
        console.log(date);
        let hours = date.getHours();
        let heading = document.querySelector('#greeting');
        console.log(hours);
        if(hours>5 && hours<12) {
      heading.innerText= `Good Morning ${personName}`;
        } else if(hours>12 &&hours<18) {
            heading.innerText=`Good Afternoon ${personName}`;
        }else{
            heading.innerText= `Good Night ${personName}`;
        }
    }


    doGreeting();

    </script>
    
</body>
</html>
